<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Start Online Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { height: 100%; background-color: #121212; color: #e0e0e0; overflow: hidden; }
        
        .chessboard-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #8ca2c7;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="%238ca2c7"/><path d="M0,0 H50 V50 H0 Z M100,0 H150 V50 H100 Z M200,0 H250 V50 H200 Z M300,0 H350 V50 H300 Z M50,50 H100 V100 H50 Z M150,50 H200 V100 H150 Z M250,50 H300 V100 H250 Z M350,50 H400 V100 H350 Z M0,100 H50 V150 H0 Z M100,100 H150 V150 H100 Z M200,100 H250 V150 H200 Z M300,100 H350 V150 H300 Z M50,150 H100 V200 H50 Z M150,150 H200 V200 H150 Z M250,150 H300 V200 H250 Z M350,150 H400 V200 H350 Z M0,200 H50 V250 H0 Z M100,200 H150 V250 H100 Z M200,200 H250 V250 H200 Z M300,200 H350 V250 H300 Z M50,250 H100 V300 H50 Z M150,250 H200 V300 H150 Z M250,250 H300 V300 H250 Z M350,250 H400 V300 H350 Z M0,300 H50 V350 H0 Z M100,300 H150 V350 H100 Z M200,300 H250 V350 H200 Z M300,300 H350 V350 H300 Z M50,350 H100 V400 H50 Z M150,350 H200 V400 H150 Z M250,350 H300 V400 H250 Z M350,350 H400 V400 H350 Z" fill="%23e4e7ed"/><g font-size="38" font-family="Arial" text-anchor="middle" dominant-baseline="central"><text x="25" y="25" fill="%23000">♜</text><text x="75" y="25" fill="%23000">♞</text><text x="125" y="25" fill="%23000">♝</text><text x="175" y="25" fill="%23000">♛</text><text x="225" y="25" fill="%23000">♚</text><text x="275" y="25" fill="%23000">♝</text><text x="325" y="25" fill="%23000">♞</text><text x="375" y="25" fill="%23000">♜</text><text x="25" y="75" fill="%23000">♟</text><text x="75" y="75" fill="%23000">♟</text><text x="125" y="75" fill="%23000">♟</text><text x="175" y="75" fill="%23000">♟</text><text x="225" y="75" fill="%23000">♟</text><text x="275" y="75" fill="%23000">♟</text><text x="325" y="75" fill="%23000">♟</text><text x="375" y="75" fill="%23000">♟</text><text x="25" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="75" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="125" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="175" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="225" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="275" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="325" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="375" y="325" fill="%23fff" stroke="%23000" stroke-width="1">♙</text><text x="25" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♖</text><text x="75" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♘</text><text x="125" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♗</text><text x="175" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♕</text><text x="225" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♔</text><text x="275" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♗</text><text x="325" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♘</text><text x="375" y="375" fill="%23fff" stroke="%23000" stroke-width="1">♖</text></g></svg>');
            background-size: 100vw; background-position: top center; background-repeat: repeat; filter: blur(3px); transform: scale(1.1); z-index: 1; transition: opacity 0.5s ease;
        }

        .bg-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 1; }

        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2; padding: 20px;
        }
        .login-box {
            position: relative;
            background: rgba(25, 25, 25, 0.95); backdrop-filter: blur(15px); padding: 35px 25px; border-radius: 20px; width: 100%; max-width: 380px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15); text-align: center;
        }
        
        .online-indicator {
            position: absolute; top: 18px; right: 20px;
            display: flex; align-items: center; gap: 6px;
        }
        .online-indicator span { font-size: 12px; color: #aaa; }
        .blue-dot {
            background: #2979ff; color: white; font-size: 11px; font-weight: bold;
            border-radius: 50%; width: 18px; height: 18px;
            display: flex; justify-content: center; align-items: center;
        }

        .login-box h2 { margin-top: 10px; margin-bottom: 25px; font-weight: 500; font-size: 1.3rem; color: #fff; }
        
        input { width: 100%; padding: 16px; margin-bottom: 12px; border: 1px solid #444; border-radius: 12px; background: #1e1e1e; color: #fff; font-size: 16px; outline: none; -webkit-appearance: none; }
        input:focus { border-color: #2979ff; }
        
        button { width: 100%; padding: 16px; border: none; border-radius: 12px; background: #2979ff; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; -webkit-appearance: none; }
        button:active { background: #1c54b2; }
        
        .dummy-btn { background: #555; margin-bottom: 25px; font-size: 15px; padding: 12px; }
        .dummy-btn:active { background: #444; }
        .dummy-btn.sent { background: #4caf50; pointer-events: none; }

        #chat-screen { display: none; position: relative; height: 100%; flex-direction: column; z-index: 3; background: #121212; }
        
        header { padding: 12px 20px; background: #1e1e1e; border-bottom: 1px solid #2d2d2d; display: flex; justify-content: space-between; align-items: center; padding-top: max(12px, env(safe-area-inset-top)); }
        
        .header-right { display: flex; align-items: center; gap: 15px; }
        .call-btn { background: none; border: none; color: #4caf50; font-size: 18px; cursor: pointer; padding: 5px; width: auto; display: flex; align-items: center; justify-content: center; }
        .call-btn:active { opacity: 0.6; }

        .status-container { display: flex; align-items: center; }
        .status-dot { width: 10px; height: 10px; background: #555; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-dot.online { background: #4caf50; }
        
        #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
        
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 14px; font-size: 14px; word-break: break-word; position: relative; transition: opacity 0.5s ease; cursor: pointer; display: flex; flex-direction: column; gap: 2px; user-select: none; -webkit-user-select: none; }
        .msg.sent { background: #2979ff; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.received { background: #2e2e2e; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .msg-content-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; width: 100%; pointer-events: none; }
        .msg.received .msg-content-row { justify-content: flex-start; }

        .text-body { flex: 1; pointer-events: none; }
        
        .msg-time { font-size: 10px; color: rgba(255,255,255,0.6); display: none; margin-top: 2px; text-align: right; pointer-events: none; }
        .msg.show-time .msg-time { display: block; }

        .status-tick { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: bold; white-space: nowrap; vertical-align: baseline; pointer-events: none; }
        .status-tick.seen { color: #81c784; }

        .reply-preview { background: rgba(0,0,0,0.2); border-left: 3px solid #fff; padding: 3px 6px; border-radius: 4px; font-size: 12px; margin-bottom: 4px; opacity: 0.85; pointer-events: none; }

        #reply-bar { display: none; background: #1a1a1a; padding: 8px 15px; border-top: 1px solid #333; align-items: center; justify-content: space-between; font-size: 13px; color: #aaa; }
        #reply-bar span { color: #fff; font-weight: 500; }
        #reply-bar button { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer; width: auto; padding: 0 5px; }

        #typing-indicator { padding: 5px 15px; font-size: 13px; color: #888; height: 25px; font-style: italic; }

        footer { padding: 10px 15px; background: #1e1e1e; display: flex; flex-direction: column; border-top: 1px solid #2d2d2d; padding-bottom: max(10px, env(safe-area-inset-top)); }
        .footer-row { display: flex; gap: 10px; width: 100%; }
        footer input { margin-bottom: 0; flex: 1; border-radius: 20px; padding: 10px 14px; font-size: 14px; }
        footer button { width: auto; padding: 0 20px; border-radius: 20px; font-size: 14px; }

        #action-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10; justify-content: center; align-items: center; }
        .action-sheet { background: #222; border-radius: 14px; width: 85%; max-width: 300px; overflow: hidden; border: 1px solid #444; display: flex; flex-direction: column; }
        .action-sheet button { background: none; border: none; padding: 15px; color: #fff; font-size: 15px; text-align: center; border-bottom: 1px solid #333; border-radius: 0; width: 100%; }
        .action-sheet button:active { background: #333; }
        .action-sheet button.danger { color: #ff5252; }

        /* Call Overlay Modal */
        #call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #call-overlay h3 { color: #fff; font-weight: 400; font-size: 1.2rem; margin-bottom: 10px; }
        .call-actions { display: flex; gap: 25px; margin-top: 10px; }
        .call-actions button { width: 55px; height: 55px; border-radius: 50%; font-size: 18px; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .btn-accept { background: #4caf50; color: #fff; }
        .btn-reject { background: #f44336; color: #fff; }
        
        .btn-mute { background: #333; color: #fff; border: 1px solid #555; }
        .btn-mute.active { background: #ff9800; border-color: #ff9800; color: #fff; }
        
        .btn-speaker { background: #333; color: #fff; border: 1px solid #555; }
        .btn-speaker.active { background: #2979ff; border-color: #2979ff; }
        .btn-end { background: #f44336; color: #fff; }
    </style>
</head>
<body>

    <div class="chessboard-bg" id="bg"><div class="bg-overlay"></div></div>

    <div id="lock-screen">
        <div class="login-box">
            <div class="online-indicator">
                <span>Users online</span>
                <div id="login-badge" class="blue-dot"></div>
            </div>

            <h2>Game Verification</h2>
            
            <input type="tel" id="mobile" placeholder="Enter mobile" autocomplete="off">
            <button class="dummy-btn" id="fake-otp-btn" onclick="dummySendOTP()">Send OTP</button>

            <input type="password" id="pwd" placeholder="Enter OTP" autocomplete="off">
            <button onclick="initializeSession()">Start Online Game</button>
        </div>
    </div>

    <div id="chat-screen">
        <header>
            <span style="font-size: 16px; font-weight: 500; color: #ccc;">Private Game Node</span>
            <div class="header-right">
                <button class="call-btn" onclick="startCall()" title="Voice Call">📞</button>
                <div class="status-container">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text" style="font-size: 13px; color: #888;">Offline</span>
                </div>
            </div>
        </header>
        <div id="messages"></div>
        <div id="typing-indicator"></div>
        
        <div id="reply-bar">
            <div>Replying to: <span id="reply-text-preview"></span></div>
            <button onclick="cancelReply()">✕</button>
        </div>

        <footer>
            <div class="footer-row">
                <input type="text" id="msg-input" placeholder="Message..." autocomplete="off" disabled>
                <button id="send-btn" onclick="handleSendAction()" disabled>Send</button>
            </div>
        </footer>
    </div>

    <!-- Call Overlay -->
    <div id="call-overlay">
        <h3 id="call-status-text">Calling...</h3>
        
        <!-- Incoming Call Actions (Accept / Reject) -->
        <div class="call-actions" id="incoming-actions" style="display: none;">
            <button class="btn-accept" onclick="acceptCall()" title="Accept">📞</button>
            <button class="btn-reject" onclick="endCall()" title="Reject">✖</button>
        </div>

        <!-- Active Call Actions (Mute / Speaker / Disconnect) -->
        <div class="call-actions" id="active-actions" style="display: none;">
            <button id="mute-btn" class="btn-mute" onclick="toggleMute()" title="Mute">🎤</button>
            <button id="speaker-btn" class="btn-speaker" onclick="toggleSpeaker()" title="Speaker">🔊</button>
            <button class="btn-end" onclick="endCall()" title="Disconnect">📞</button>
        </div>

        <audio id="remote-audio" autoplay></audio>
    </div>

    <div id="action-modal" onclick="closeActionModal(event)">
        <div class="action-sheet" id="action-sheet-content">
            <button id="menu-reply-btn" onclick="triggerReplyFromMenu()">Reply</button>
            <button id="menu-edit-btn" onclick="triggerEditFromMenu()" style="display:none;">Edit (within 30s)</button>
            <button id="menu-del-btn" class="danger" onclick="triggerDeleteFromMenu()" style="display:none;">Delete</button>
            <button onclick="closeActionModal()" style="border-bottom:none; color:#888;">Cancel</button>
        </div>
    </div>

    <script>
        const USER_1_PASSWORD = "290624"; 
        const USER_2_PASSWORD = "160824";

        let cryptoKey = null;
        let roomID = null;
        let ws = null;
        let myID = Math.random().toString(36).substring(2, 10);
        let typingTimeout = null;
        let isTabActive = true;
        let messages = []; 
        let unreadCount = 0;
        let listenersSetup = false;
        
        let replyingToId = null;
        let editingMsgId = null;
        let selectedMsgForMenu = null;

        // WebRTC Call Variables
        let pc = null;
        let localStream = null;
        let isSpeakerOn = false;
        let isMuted = false;
        let pendingOffer = null;
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function updateLoginBadge() {
            const badge = document.getElementById('login-badge');
            if (unreadCount > 0) {
                badge.innerText = unreadCount;
            } else {
                badge.innerText = ''; 
            }
        }
        updateLoginBadge();

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playNotificationSound() {
            if (isTabActive) return; 
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); 
            oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function dummySendOTP() {
            const btn = document.getElementById('fake-otp-btn');
            btn.innerText = 'Sent ✓';
            btn.classList.add('sent');
        }

        window.onfocus = () => { 
            isTabActive = true; 
            const isChatVisible = document.getElementById('chat-screen').style.display === 'flex';
            if (isChatVisible && ws && ws.readyState === WebSocket.OPEN) {
                unreadCount = 0;
                updateLoginBadge();
                messages.forEach(m => {
                    if (m.type === 'received' && m.status !== 'seen') {
                        m.status = 'seen';
                        saveLocalHistory();
                        ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'seen', msgId: m.id }));
                    }
                });
            }
        };
        window.onblur = () => { isTabActive = false; };

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                isTabActive = false;
                if (document.getElementById('chat-screen').style.display === 'flex') {
                    document.getElementById('messages').innerHTML = ''; 
                    document.getElementById('chat-screen').style.display = 'none';
                    document.getElementById('bg').style.display = 'block';
                    document.getElementById('lock-screen').style.display = 'flex';
                    document.getElementById('pwd').value = ''; 
                    document.getElementById('mobile').value = '';
                    const fakeBtn = document.getElementById('fake-otp-btn');
                    fakeBtn.innerText = 'Send OTP';
                    fakeBtn.classList.remove('sent');
                }
            } else {
                isTabActive = true;
            }
        });

        async function deriveKey(p1, p2) {
            const combined = [p1, p2].sort().join('::');
            const data = new TextEncoder().encode(combined);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            roomID = Array.from(new Uint8Array(hashBuffer)).slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
            cryptoKey = await crypto.subtle.importKey('raw', hashBuffer, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
        }

        async function encryptData(text) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, new TextEncoder().encode(text));
            return { ciphertext: btoa(String.fromCharCode(...new Uint8Array(encrypted))), iv: btoa(String.fromCharCode(...iv)) };
        }

        async function decryptData(ciphertextB64, ivB64) {
            try {
                const iv = new Uint8Array(atob(ivB64).split('').map(c => c.charCodeAt(0)));
                const ciphertext = new Uint8Array(atob(ciphertextB64).split('').map(c => c.charCodeAt(0)));
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch (e) { return "[Error]"; }
        }

        async function saveLocalHistory() {
            const dataStr = JSON.stringify(messages);
            const encrypted = await encryptData(dataStr);
            localStorage.setItem('chat_hist_' + roomID, JSON.stringify(encrypted));
        }

        async function loadLocalHistory() {
            const stored = localStorage.getItem('chat_hist_' + roomID);
            messages = [];
            if (stored) {
                try {
                    const parsed = JSON.parse(stored);
                    const decryptedStr = await decryptData(parsed.ciphertext, parsed.iv);
                    messages = JSON.parse(decryptedStr);
                } catch(e) { console.error("Decryption failed."); }
            }
            document.getElementById('messages').innerHTML = ''; 
            messages.forEach(msg => appendMessageDOM(msg));
        }

        async function initializeSession() {
            const enteredPassword = document.getElementById('pwd').value;
            if (enteredPassword !== USER_1_PASSWORD && enteredPassword !== USER_2_PASSWORD) {
                alert("Access Denied: Incorrect OTP.");
                document.getElementById('pwd').value = ''; return;
            }

            initAudio(); 
            isTabActive = true;
            await deriveKey(USER_1_PASSWORD, USER_2_PASSWORD);
            await loadLocalHistory(); 
            
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('bg').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            
            unreadCount = 0;
            updateLoginBadge();
            
            connectNetwork();
            setupInputListeners();
        }

        function connectNetwork() {
            const pieSocketURL = 'wss://free.blr2.piesocket.com/v3/1?api_key=W028guWx83kfU37EXPvD3WnXTEQYukFgU4V7JGkj&notify_self=1';
            ws = new WebSocket(pieSocketURL);

            ws.onopen = () => {
                document.getElementById('status-dot').className = 'status-dot online';
                document.getElementById('status-text').innerText = 'Game Node Online';
                document.getElementById('msg-input').disabled = false;
                document.getElementById('send-btn').disabled = false;
                ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'hello' }));
                setInterval(() => { if(ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ping: true})); }, 30000);
            };

            ws.onclose = () => {
                document.getElementById('status-dot').className = 'status-dot';
                document.getElementById('status-text').innerText = 'Offline';
            };

            ws.onmessage = async (e) => {
                const packet = JSON.parse(e.data);
                if (packet.ping || packet.sender === myID || packet.room !== roomID) return;

                if (packet.type === 'hello') {
                    messages.forEach(m => {
                        if (m.type === 'sent' && m.status !== 'seen' && !m.deleted) {
                            sendPayloadViaWS('chat', m); 
                        } else if (m.type === 'received' && !m.deleted) {
                            ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'seen', msgId: m.id }));
                        }
                    });
                } 
                else if (packet.type === 'chat') {
                    let existing = messages.find(m => m.id === packet.msgId);
                    const decryptedText = await decryptData(packet.payload, packet.iv);
                    const isChatVisible = document.getElementById('chat-screen').style.display === 'flex';
                    const isMsgSeen = isTabActive && isChatVisible;

                    if (existing) {
                        existing.text = decryptedText;
                        existing.edited = true;
                        updateMessageDOM(existing);
                        saveLocalHistory();
                    } else {
                        const newMsg = { 
                            id: packet.msgId, text: decryptedText, type: 'received', 
                            time: packet.time, status: isMsgSeen ? 'seen' : 'unread',
                            replyTo: packet.replyTo || null, timestamp: packet.timestamp || Date.now()
                        };
                        if (!isMsgSeen) {
                            unreadCount++;
                            updateLoginBadge();
                            playNotificationSound(); 
                        }
                        messages.push(newMsg);
                        saveLocalHistory();
                        appendMessageDOM(newMsg);
                    }
                    if(isChatVisible && isTabActive) {
                        ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'seen', msgId: packet.msgId }));
                    }
                } 
                else if (packet.type === 'delete') {
                    let target = messages.find(m => m.id === packet.msgId);
                    if (target) {
                        target.deleted = true;
                        target.text = "This message was deleted";
                        updateMessageDOM(target);
                        saveLocalHistory();
                    }
                }
                else if (packet.type === 'seen') {
                    const msg = messages.find(m => m.id === packet.msgId);
                    if (msg && msg.status !== 'seen') {
                        msg.status = 'seen';
                        saveLocalHistory();
                        updateMessageStatusDOM(msg.id, 'seen');
                    }
                }
                else if (packet.type === 'typing') {
                    document.getElementById('typing-indicator').innerText = packet.status ? "Typing..." : "";
                }
                // --- WebRTC Signaling Handlers ---
                else if (packet.type === 'call-offer') {
                    showIncomingCallOverlay(packet.offer);
                }
                else if (packet.type === 'call-answer') {
                    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(packet.answer));
                    
                    document.getElementById('call-status-text').innerText = "Connected";
                    document.getElementById('incoming-actions').style.display = 'none';
                    document.getElementById('active-actions').style.display = 'flex';
                    
                    setDefaultAudioOutput(); 
                }
                else if (packet.type === 'ice-candidate') {
                    if (pc && packet.candidate) {
                        await pc.addIceCandidate(new RTCIceCandidate(packet.candidate));
                    }
                }
                else if (packet.type === 'call-end') {
                    cleanupCall();
                }
            };
        }

        // --- WebRTC Audio Call Logic ---
        
        async function startCall() {
            document.getElementById('call-status-text').innerText = "Calling...";
            
            document.getElementById('incoming-actions').style.display = 'none';
            document.getElementById('active-actions').style.display = 'flex';
            document.getElementById('call-overlay').style.display = 'flex';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                pc = new RTCPeerConnection(rtcConfig);
                
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                
                pc.ontrack = (event) => {
                    document.getElementById('remote-audio').srcObject = event.streams[0];
                };
                
                pc.onicecandidate = (event) => {
                    if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'ice-candidate', candidate: event.candidate }));
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'call-offer', offer: offer }));
                }
            } catch (err) {
                alert("Microphone permission denied.");
                endCall();
            }
        }

        function showIncomingCallOverlay(offer) {
            pendingOffer = offer;
            document.getElementById('call-status-text').innerText = "Incoming Call...";
            
            document.getElementById('incoming-actions').style.display = 'flex';
            document.getElementById('active-actions').style.display = 'none';
            document.getElementById('call-overlay').style.display = 'flex';
        }

        async function acceptCall() {
            document.getElementById('call-status-text').innerText = "Connecting...";
            document.getElementById('incoming-actions').style.display = 'none';

            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true } 
                });
                pc = new RTCPeerConnection(rtcConfig);
                
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                
                pc.ontrack = (event) => {
                    document.getElementById('remote-audio').srcObject = event.streams[0];
                };
                
                pc.onicecandidate = (event) => {
                    if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'ice-candidate', candidate: event.candidate }));
                    }
                };

                await pc.setRemoteDescription(new RTCSessionDescription(pendingOffer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'call-answer', answer: answer }));
                }
                
                document.getElementById('call-status-text').innerText = "Connected";
                document.getElementById('incoming-actions').style.display = 'none';
                document.getElementById('active-actions').style.display = 'flex';
                
                setDefaultAudioOutput();

            } catch (err) {
                endCall();
            }
        }

        // Toggle Mute Feature
        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted; // Toggle track transmission
                
                const btn = document.getElementById('mute-btn');
                if (isMuted) {
                    btn.classList.add('active');
                    btn.innerText = '🔇';
                } else {
                    btn.classList.remove('active');
                    btn.innerText = '🎤';
                }
            }
        }

        async function setDefaultAudioOutput() {
            isSpeakerOn = false;
            document.getElementById('speaker-btn').classList.remove('active');
            
            const audioElem = document.getElementById('remote-audio');
            if (!audioElem.setSinkId || !navigator.mediaDevices.enumerateDevices) return; 

            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioOutputs = devices.filter(device => device.kind === 'audiooutput');
                
                const earpiece = audioOutputs.find(d => 
                    d.label.toLowerCase().includes('earpiece') || 
                    d.label.toLowerCase().includes('handset')
                );
                
                if (earpiece) {
                    await audioElem.setSinkId(earpiece.deviceId);
                } else {
                    await audioElem.setSinkId('default'); 
                }
            } catch (err) { console.log("Audio routing blocked by browser."); }
        }

        async function toggleSpeaker() {
            isSpeakerOn = !isSpeakerOn;
            const audioElem = document.getElementById('remote-audio');
            const btn = document.getElementById('speaker-btn');
            
            if (isSpeakerOn) btn.classList.add('active');
            else btn.classList.remove('active');
            
            if (!audioElem.setSinkId || !navigator.mediaDevices.enumerateDevices) return;

            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioOutputs = devices.filter(device => device.kind === 'audiooutput');

                if (isSpeakerOn) {
                    const speaker = audioOutputs.find(d => d.label.toLowerCase().includes('speaker'));
                    if (speaker) await audioElem.setSinkId(speaker.deviceId);
                    else await audioElem.setSinkId(audioOutputs[0]?.deviceId || '');
                } else {
                    const earpiece = audioOutputs.find(d => 
                        d.label.toLowerCase().includes('earpiece') || 
                        d.label.toLowerCase().includes('handset')
                    );
                    if (earpiece) await audioElem.setSinkId(earpiece.deviceId);
                    else await audioElem.setSinkId('default'); 
                }
            } catch (err) { console.log("Audio routing blocked by browser."); }
        }

        function endCall() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'call-end' }));
            }
            cleanupCall();
        }

        function cleanupCall() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            if (pc) {
                pc.close();
                pc = null;
            }
            pendingOffer = null;
            
            // Reset UI states
            isSpeakerOn = false;
            document.getElementById('speaker-btn').classList.remove('active');
            
            isMuted = false;
            const muteBtn = document.getElementById('mute-btn');
            muteBtn.classList.remove('active');
            muteBtn.innerText = '🎤';
            
            document.getElementById('call-overlay').style.display = 'none';
            document.getElementById('remote-audio').srcObject = null;
        }

        // --- Keyboard Stays Open on Send ---
        function handleSendAction() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if(!text) return;
            
            input.value = ''; 
            input.focus(); // Keep keyboard open

            if (editingMsgId) {
                let msgObj = messages.find(m => m.id === editingMsgId);
                if (msgObj) {
                    msgObj.text = text;
                    msgObj.edited = true;
                    saveLocalHistory();
                    updateMessageDOM(msgObj);
                    sendPayloadViaWS('chat', msgObj);
                }
                cancelEdit();
            } else {
                const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const msgObj = { 
                    id: Date.now().toString() + Math.floor(Math.random()*1000), 
                    text: text, type: 'sent', status: 'sent', time: timeStr,
                    replyTo: replyingToId, timestamp: Date.now()
                };
                messages.push(msgObj);
                saveLocalHistory();
                appendMessageDOM(msgObj);
                sendPayloadViaWS('chat', msgObj);
                cancelReply();
            }
        }

        async function sendPayloadViaWS(type, msgObj) {
            if(!ws || ws.readyState !== WebSocket.OPEN) return;
            const encrypted = await encryptData(msgObj.text);
            const payload = { 
                room: roomID, sender: myID, type: type, msgId: msgObj.id, 
                payload: encrypted.ciphertext, iv: encrypted.iv, time: msgObj.time,
                replyTo: msgObj.replyTo, timestamp: msgObj.timestamp
            };
            ws.send(JSON.stringify(payload));
            ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'typing', status: false }));
        }

        function appendMessageDOM(msg) {
            const container = document.getElementById('messages');
            const msgNode = document.createElement('div');
            msgNode.className = `msg ${msg.type}`;
            msgNode.id = `msg-${msg.id}`; 
            
            // --- Click vs Long-Press Logic ---
            let pressTimer;
            let isLongPress = false;

            const startPress = () => {
                isLongPress = false;
                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    msgNode.classList.toggle('show-time'); // Long press shows time
                }, 500);
            };
            const endPress = () => clearTimeout(pressTimer);

            msgNode.ontouchstart = startPress;
            msgNode.ontouchend = endPress;
            msgNode.onmousedown = startPress;
            msgNode.onmouseup = endPress;

            msgNode.onclick = () => {
                if (!isLongPress) openActionModal(msg); // Single click opens menu
            };

            let innerHTML = '';
            
            if (msg.replyTo) {
                let parentMsg = messages.find(m => m.id === msg.replyTo);
                let previewText = parentMsg ? parentMsg.text : "Original message";
                innerHTML += `<div class="reply-preview">↳ ${escapeHTML(previewText)}</div>`;
            }

            let tickHTML = '';
            if (msg.type === 'sent') {
                let tickSymbol = msg.status === 'seen' ? '✓✓' : '✓';
                let tickClass = msg.status === 'seen' ? 'status-tick seen' : 'status-tick';
                tickHTML = `<span class="${tickClass}">${tickSymbol}</span>`;
            }

            let bodyText = msg.deleted ? `<i>${escapeHTML(msg.text)}</i>` : escapeHTML(msg.text);
            if (msg.edited && !msg.deleted) bodyText += ` <span style="font-size:10px; opacity:0.6;">(edited)</span>`;

            innerHTML += `
                <div class="msg-content-row">
                    <span class="text-body">${bodyText}</span>
                    ${tickHTML}
                </div>
                <div class="msg-time">${msg.time}</div>
            `;

            msgNode.innerHTML = innerHTML;
            container.appendChild(msgNode);
            container.scrollTop = container.scrollHeight;
        }

        function updateMessageDOM(msg) {
            const msgNode = document.getElementById(`msg-${msg.id}`);
            if (msgNode) {
                let bodyText = msg.deleted ? `<i>${escapeHTML(msg.text)}</i>` : escapeHTML(msg.text);
                if (msg.edited && !msg.deleted) bodyText += ` <span style="font-size:10px; opacity:0.6;">(edited)</span>`;
                
                const textBody = msgNode.querySelector('.text-body');
                if (textBody) textBody.innerHTML = bodyText;
            }
        }

        function updateMessageStatusDOM(id, status) {
            const msgNode = document.getElementById(`msg-${id}`);
            if (msgNode) {
                const tick = msgNode.querySelector('.status-tick');
                if (tick) {
                    tick.innerText = '✓✓';
                    tick.className = 'status-tick seen';
                }
            }
        }

        function openActionModal(msg) {
            selectedMsgForMenu = msg;
            const modal = document.getElementById('action-modal');
            
            const replyBtn = document.getElementById('menu-reply-btn');
            const editBtn = document.getElementById('menu-edit-btn');
            const delBtn = document.getElementById('menu-del-btn');
            
            const isMine = (msg.type === 'sent');
            const within30Secs = (Date.now() - msg.timestamp <= 30000);

            // Left side (Received) vs Right side (Sent) Logic
            if (msg.deleted) {
                replyBtn.style.display = 'none';
            } else {
                replyBtn.style.display = 'block';
            }

            if (isMine && within30Secs && !msg.deleted) {
                editBtn.style.display = 'block';
                delBtn.style.display = 'block';
            } else if (isMine && !msg.deleted) {
                editBtn.style.display = 'none';
                delBtn.style.display = 'block'; // Can always delete own message locally/globally
            } else {
                // Not mine (Left side received message)
                editBtn.style.display = 'none';
                delBtn.style.display = 'none';
            }

            modal.style.display = 'flex';
        }

        function closeActionModal(e) {
            if (!e || e.target.id === 'action-modal') {
                document.getElementById('action-modal').style.display = 'none';
            }
        }

        function triggerReplyFromMenu() {
            closeActionModal();
            if (!selectedMsgForMenu) return;
            replyingToId = selectedMsgForMenu.id;
            document.getElementById('reply-text-preview').innerText = selectedMsgForMenu.text;
            document.getElementById('reply-bar').style.display = 'flex';
            document.getElementById('msg-input').focus();
        }

        function cancelReply() {
            replyingToId = null;
            document.getElementById('reply-bar').style.display = 'none';
        }

        function triggerEditFromMenu() {
            closeActionModal();
            if (!selectedMsgForMenu || selectedMsgForMenu.deleted) return;
            editingMsgId = selectedMsgForMenu.id;
            const input = document.getElementById('msg-input');
            input.value = selectedMsgForMenu.text;
            input.focus();
        }

        function cancelEdit() {
            editingMsgId = null;
            document.getElementById('msg-input').value = '';
        }

        function triggerDeleteFromMenu() {
            closeActionModal();
            if (!selectedMsgForMenu) return;
            
            selectedMsgForMenu.deleted = true;
            selectedMsgForMenu.text = "This message was deleted";
            updateMessageDOM(selectedMsgForMenu);
            saveLocalHistory();

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'delete', msgId: selectedMsgForMenu.id }));
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function setupInputListeners() {
            if (listenersSetup) return; 
            listenersSetup = true;
            const input = document.getElementById('msg-input');
            input.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleSendAction(); });
            input.addEventListener('input', () => {
                if(!ws || ws.readyState !== WebSocket.OPEN) return;
                ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'typing', status: true }));
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => ws.send(JSON.stringify({ room: roomID, sender: myID, type: 'typing', status: false })), 2000);
            });
        }
    </script>
